# Builds and deploys the site to GitHub Pages.
# Before deploying, it pulls the public works from ORCID and updates the
# Publications section; if something changed, the update is also committed.
name: Sync ORCID and deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed publication files
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync publications from ORCID
        env:
          ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}   # optional, not required
        run: python scripts/orcid_sync.py

      - name: Commit updated publications
        run: |
          if git diff --quiet -- index.html publications.bib data/; then
            echo "Publications unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications.bib data/
          git commit -m "Update publications from ORCID"
          git push || (git pull --rebase origin main && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
